name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rama-dev
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar tipos de TypeScript
        run: npm run typecheck

      - name: Ejecutar linter
        run: npm run lint

  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar codigo Dart
        run: dart analyze

      - name: Build web check
        run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL=http://localhost:3000
