services:
  db:
    image: postgres:16-alpine
    container_name: ubbike_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ubbike
      POSTGRES_USER: ubbike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubbike -d ubbike"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ubbike_network
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    container_name: ubbike_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DB_SYNCHRONIZE: "false"
      SEED_DEMO_DATA: "false"
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - ubbike_network

  mobile:
    build:
      context: ./mobile
      args:
        API_BASE_URL: ${PUBLIC_API_BASE_URL:?Define PUBLIC_API_BASE_URL en .env}
    container_name: ubbike_mobile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ubbike_network

volumes:
  postgres_data:

networks:
  ubbike_network:
    name: ubbike_network
    driver: bridge
