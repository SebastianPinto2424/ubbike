services:
  db:
    image: postgres:16-alpine
    container_name: ubbike_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ubbike}
      POSTGRES_USER: ${POSTGRES_USER:-ubbike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ubbike_password_demo_2026}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ubbike} -d ${POSTGRES_DB:-ubbike}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ubbike_network
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: ubbike_redis
    restart: unless-stopped
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    ports:
      - "127.0.0.1:6379:6379"
    tmpfs:
      - /data:uid=999,gid=1000,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ubbike_network

  backend:
    build:
      context: ./backend
    container_name: ubbike_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-ubbike}
      DB_NAME: ${POSTGRES_DB:-ubbike}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ubbike_password_demo_2026}
      DB_SYNCHRONIZE: "false"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      JWT_SECRET: ${JWT_SECRET:-ubbike_jwt_secret_demo_para_entrega_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_ISSUER: ${JWT_ISSUER:-ubbike-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ubbike-app}
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS_RATE_LIMIT: "true"
      TRUST_PROXY: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: UBBike <no-reply@ubbike.local>
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ubbike_network

  frontend:
    build:
      context: ./mobile
      args:
        API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3000}
        CSP_CONNECT_SRC: "'self' ${PUBLIC_API_BASE_URL:-http://localhost:3000} http://127.0.0.1:${BACKEND_PORT:-3000}"
    container_name: ubbike_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ubbike_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: ubbike_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ubbike_network

volumes:
  postgres_data:

networks:
  ubbike_network:
    name: ubbike_network
    driver: bridge
